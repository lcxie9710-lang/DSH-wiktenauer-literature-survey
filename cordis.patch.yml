# weinao (维脑 Agent) bundle patch: insert the HEMA research plugin.
# Install with `dsh plugin --profile web add @ghogiel/dsh-weinao`,
# or copy these rows into your profile's cordis.patch.yml.

- insert:
    - id: dsh-weinao
      name: '@ghogiel/dsh-weinao'
      config:
        # Optional: where the local glossary JSON lives (defaults to
        # $DSH_HOME/wiktenauer/glossary.json, i.e. ~/.dsh/wiktenauer/).
        # glossaryDir: /absolute/path/to/glossary
        # Optional: prompt-section order (lower = earlier, persona is 0).
        # sectionOrder: 1000
